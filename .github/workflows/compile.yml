name: Compile sing-box Rulesets

on:
  push:
    branches:
      - main # 或 master，根据你的默认分支调整
    paths:
      - 'sing-box/*.json' # 仅在 JSON 文件被修改/新增时触发
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          # 自动获取并安装最新版 sing-box
          SING_BOX_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          wget "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -zxvf sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz
          sudo mv sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box /usr/local/bin/
          sing-box version

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Compile JSON to SRS
        run: |
          # 遍历所有 json 文件
          find . -type f -name "*.json" | while read -r json_file; do
            srs_file="${json_file%.json}.srs"
            echo "Compiling $json_file -> $srs_file"
            
            # 使用 jq 删除顶层多余的 date 字段（如果还有 version 等非标准字段也可一并 del）
            # 净化后的 json 存入临时文件后交由 sing-box 编译
            jq 'del(.date)' "$json_file" > /tmp/clean_rule.json
            
            # 执行编译
            sing-box rule-set compile /tmp/clean_rule.json -o "$srs_file"
            
            # 清理临时文件
            rm -f /tmp/clean_rule.json
          done

      - name: Commit and Push Compiled Rules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.srs
          # 检查是否有文件更新，避免产生无意义的空 commit
          if git status --porcelain | grep -q 'A \|M '; then
            git commit -m "auto: compile rulesets to srs [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
