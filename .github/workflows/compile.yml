name: Compile sing-box Rulesets

on:
  push:
    branches:
      - main # 如果你的主分支是 master，请修改为 master
    paths:
      - 'sing-box/*.json' #修改对应的目录
  workflow_dispatch:

# ---------------- 关键增加部分 ----------------
permissions:
  contents: write # 赋予 GitHub Actions 对仓库内容的写权限 (Push 代码)
# ----------------------------------------------
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          # 自动获取并安装最新版 sing-box
          SING_BOX_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -oP '"tag_name": "v\K[^"]+')
          wget "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -zxvf sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz
          sudo mv sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box /usr/local/bin/
          sing-box version

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Clean and Compile JSON to SRS
        run: |
          echo "开始处理并编译规则文件..."
          
          # 定义需要过滤的水印/特征域名
          TARGET_DOMAIN="7h15.ru1353t.1s.m4d3.by.5ukk4w.skk.moe"

          find . -type f -name "*.json" ! -path "*/Mock/*" | while read -r json_file; do
            # 1. 检查 JSON 根节点是否为对象 ({...})
            json_type=$(jq -r 'type' "$json_file" 2>/dev/null)
            if [ "$json_type" != "object" ]; then
              continue
            fi

            # 2. 检查是否包含 rules 字段
            has_rules=$(jq 'has("rules")' "$json_file" 2>/dev/null)
            if [ "$has_rules" != "true" ]; then
              continue
            fi

            srs_file="${json_file%.json}.srs"
            echo "Processing and compiling: $json_file -> $srs_file"

            # 3. 使用 jq 过滤特定域名 + 保留标准 root 字段 {version, rules}
            # - map_values: 遍历 rules 数组下的每一个规则对象
            # - del(.domain[]? / .domain_suffix[]?): 剔除指定的特定域名
            # - del(select(... | length == 0)): 如果剔除后数组变空，一并清理掉空键，保持 JSON 简洁
            jq --arg target "$TARGET_DOMAIN" '
              {
                version: .version,
                rules: [
                  .rules[] | 
                  (if .domain then .domain |= map(select(. != $target)) else . end) |
                  (if .domain_suffix then .domain_suffix |= map(select(. != $target)) else . end) |
                  del(.domain[]? | select(. == null)) |
                  del(.domain_suffix[]? | select(. == null))
                ]
              }
            ' "$json_file" > /tmp/clean_rule.json

            # 4. 执行 sing-box 编译
            if sing-box rule-set compile /tmp/clean_rule.json -o "$srs_file"; then
              echo "Successfully compiled: $srs_file"
            else
              echo "Error compiling: $json_file"
              exit 1
            fi

            rm -f /tmp/clean_rule.json
          done

      - name: Commit and Push Compiled Rules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.srs
          # 检查是否有文件更新，避免产生无意义的空 commit
          if git status --porcelain | grep -q 'A \|M '; then
            git commit -m "auto: compile rulesets to srs [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
