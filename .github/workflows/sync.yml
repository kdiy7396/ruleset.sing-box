name: Sync Upstream Rulesets

on:
  # 每日定时运行 (UTC 20:00，即北京时间/KST 凌晨 04:00)
  schedule:
    - cron: '0 20 * * *'
  # 支持在 GitHub 页面手动点击运行测试
  workflow_dispatch:

permissions:
  contents: write
  actions: write # 赋予调用/启动其他 Workflow 的权限

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest JSON from Upstream
        run: |
          echo "开始拉取上游规则仓库内容..."
          git clone --depth 1 https://github.com/SukkaLab/ruleset.skk.moe.git /tmp/upstream

          mkdir -p ./sing-box

          # 强制覆盖复制：将上游最新文件覆盖到本地
          if [ -d "/tmp/upstream/sing-box" ]; then
            cp -f /tmp/upstream/sing-box/*.json ./sing-box/ 2>/dev/null || true
          fi
          cp -f /tmp/upstream/*.json ./ 2>/dev/null || true

          rm -rf /tmp/upstream

      - name: Commit and Push Updated JSONs
        id: git_check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 强制暂存所有 json 文件的更改（包括文件内行的增删修改）
          git add -A *.json */*.json

          # 2. 核心修改：使用 git diff-index 专门检查暂存区与 HEAD 之间的文件内容差异
          # 如果返回值不为 0，说明有文件内部内容（IP/Domain 等）被修改了
          if ! git diff-index --quiet HEAD --; then
            echo "检测到 JSON 内容变动（IP/域名规则增减），准备提交..."
            git commit -m "feat: sync updated ruleset content from upstream"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "最新 JSON 已提交推送。"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "比对结果：上游 JSON 内容与当前仓库完全一致，未发生任何增删修改。"
          fi

      - name: Trigger Compile Workflow
        # 只要 JSON 有更新，或者你在 GitHub 页面手动点击触发时，就启动编译 Action
        if: steps.git_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "触发编译工作流 compile.yml ..."
          # 语法：gh workflow run <编译Action的文件名或名称>
          gh workflow run compile.yml || gh workflow run "Compile sing-box Rulesets"
